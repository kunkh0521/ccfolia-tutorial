<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCFolia 使用教學</title>
    <!-- 引入 React 和 Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #111111;
            color: #e5e5e5;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .noselect {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 圖示元件
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                menu: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
                image: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
                chevronRight: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>,
                video: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>,
                plus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                minus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                refresh: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
                maximize: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
            };
            return icons[name] || null;
        };

        // 文字美化元件
        const FormattedText = ({ text }) => {
    // 這裡是在告訴電腦：除了 **高亮** 和 !!紅色!!，還要認得 [文字](網址)
    const parts = text.split(/(\*\*.*?\*\*|!!.*?!!|\[.*?\]\(.*?\))/g);
    
    return (
        <div className="text-gray-300 leading-8 text-lg">
            {parts.map((part, i) => {
                // 1. 如果是 **粗體**
                if (part.startsWith('**') && part.endsWith('**')) {
                    return <span key={i} className="text-teal-400 font-bold mx-1 px-1.5 bg-teal-900/30 rounded border border-teal-500/30">{part.slice(2, -2)}</span>;
                }
                // 2. 如果是 !!警示!!
                if (part.startsWith('!!') && part.endsWith('!!')) {
                    return <span key={i} className="text-red-400 font-bold mx-1 px-1.5 bg-red-900/30 rounded border border-red-500/30">{part.slice(2, -2)}</span>;
                }
                // 3. 【新增的部分】如果是 [連結名稱](網址)
                if (part.startsWith('[') && part.endsWith(')')) {
                    const match = part.match(/^\[(.*?)\]\((.*?)\)$/);
                    if (match) {
                        return (
                            <a key={i} href={match[2]} target="_blank" rel="noopener noreferrer" className="text-teal-400 hover:text-teal-300 underline decoration-dotted underline-offset-4 mx-1 transition-colors">
                                {match[1]}
                            </a>
                        );
                    }
                }
                // 4. 一般文字直接顯示
                return part;
            })}
        </div>
    );
};

        // --- 教學內容資料 ---
        // !!! 這裡請將 src 替換成您的 GitHub Raw 連結 !!!
        // 格式範例：https://raw.githubusercontent.com/使用者/專案/main/檔名.webm
        const tutorialData = [
            // --- 基本教學 ---
            {
                id: 'lang',
                category: '基本教學',
                title: '1. 如何將 CCFolia 轉換成中文版',
                content: [
                    { type: 'text', text: '首先先到 [CCFOLIA 頁面](https://ccfolia.com/)，並點選右上角的 **語言**。' },
                    { type: 'text', text: '接著改成 **繁體中文** 即可。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/001.webm', hint: '右上角語言選單 -> 選擇繁體中文' } 
                ]
            },
            {
                id: 'hide',
                category: '基本教學',
                title: '2. 如何將棋子收起',
                content: [
                    { type: 'text', text: '對著角色接著並對角色點選 **右鍵**。' },
                    { type: 'text', text: '選擇 **To own piece**。' },
                    { type: 'text', text: '接著點選對話框上的 **人像 icon**，並選擇你的角色。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/002.webm', hint: '右鍵選單 To own piece -> 對話框選擇角色' }
                ]
            },
            {
                id: 'dice',
                category: '基本教學',
                title: '3. 如何擲骰',
                content: [
                    { type: 'text', text: '可以直接點選對話框上的 **骰子**。' },
                    { type: 'text', text: '由右到左是 **D4、D6、D8、D12、D20、D100**。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/003.webm', hint: '對話框骰子列 (D4~D100)' },
                    { type: 'text', text: '對話框名字右手邊有一個 **小圖標**。' },
                    { type: 'text', text: '點開來後會跳出 **常用對話表**。' },
                    { type: 'text', text: '接著點擊需要的語法會自動輸入到訊息裡，**Enter** 送出。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/004.webm', hint: '常用對話表選單 -> 點擊語法' },
                    { type: 'text', text: '**雙擊** 則會自動送出並且擲骰。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/005.webm', hint: '雙擊語法直接送出' }
                ]
            },
            {
                id: 'music',
                category: '基本教學',
                title: '4. 如何調整房間音樂',
                content: [
                    { type: 'text', text: '左手邊的 **拉條** 直接拉動可以調整大小聲。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/006.webm', hint: '調整左側音量拉條' },
                    { type: 'text', text: '中間的 **靜音鈕** 會關閉音樂。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/007.webm', hint: '點擊中間靜音鈕' },
                    { type: 'text', text: '右手邊的 **暫停鈕** 會關閉所有使用者的音樂，!!請勿點擊!!。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/008.webm', hint: '右側暫停按鈕 (警告圖示)' }
                ]
            },
            {
                id: 'operate',
                category: '基本教學',
                title: '5. 操作房間畫面及物品',
                content: [
                    { type: 'text', text: '滑動 **滾輪** 可以放大或縮小房間畫面。' },
                    { type: 'text', text: '或者點擊右下角的 **+/-**。' },
                    { type: 'text', text: '按住不放物品可以 **移動位置**。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/009.webm', hint: '滾輪縮放或拖拉物品' }
                ]
            },
            // --- 進階教學 ---
            {
                id: 'color',
                category: '進階教學',
                title: '1. 改變名字顏色',
                content: [
                    { type: 'text', text: '角色收起後，在名字的右手邊有一個 **調色盤**。' },
                    { type: 'text', text: '點選後就會跳出調色盤，選取顏色後 **ID 顏色** 就會更改。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/010.webm', hint: '點擊調色盤更改 ID 顏色' }
                ]
            },
            {
                id: 'stats',
                category: '進階教學',
                title: '2. 調整角色數值',
                content: [
                    { type: 'text', text: '點選左邊 **角色頭像** 就會跳出可更改的數值。' },
                    { type: 'text', text: '點 **上/下**，就會增加/減少。' },
                    // 請修改下方 src
                    { type: 'image', src: 'https://kunkh0521.github.io/ccfolia-tutorial/gif/011.webm', hint: '點擊頭像 -> 上下調整數值' }
                ]
            }
        ];

        // 媒體顯示元件：支援縮放、拖曳、強制手機播放
        const MediaDisplay = ({ src, hint }) => {
            const [scale, setScale] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });
            const containerRef = useRef(null);
            const videoRef = useRef(null); 

            // 如果沒有提供 src，顯示佔位符
            if (!src) {
                return (
                    <div className="w-full bg-[#161616] rounded-xl border border-gray-800 p-1 my-6 shadow-xl overflow-hidden group hover:border-gray-600 transition-all duration-300">
                        <div className="aspect-video w-full bg-gray-800/30 rounded-lg border border-dashed border-gray-700 flex flex-col items-center justify-center relative">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-gray-800/40 via-transparent to-transparent opacity-50"></div>
                            <div className="z-10 flex flex-col items-center text-center px-4 pointer-events-none">
                                <div className="bg-gray-900 p-3 rounded-full mb-3 shadow-lg group-hover:scale-110 transition-transform duration-300">
                                    <Icon name="image" size={28} className="text-teal-500" />
                                </div>
                                <p className="text-gray-400 font-medium mb-1 tracking-wide">待補影片/圖片</p>
                                <span className="text-xs text-gray-500 bg-black/40 px-2 py-1 rounded border border-gray-700/50">{hint}</span>
                            </div>
                        </div>
                    </div>
                );
            }

            const isVideo = src.toLowerCase().endsWith('.webm') || src.toLowerCase().endsWith('.mp4');

            // --- 強制手機播放邏輯 ---
            useEffect(() => {
                if (isVideo && videoRef.current) {
                    videoRef.current.load(); 
                    const playPromise = videoRef.current.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // console.log("Auto-play was prevented:", error);
                        });
                    }
                }
            }, [src, isVideo]); 

            // 處理縮放
            const handleZoom = (delta) => {
                setScale(prev => {
                    const newScale = Math.min(Math.max(1, prev + delta), 5); 
                    if (newScale === 1) setPosition({ x: 0, y: 0 }); 
                    return newScale;
                });
            };

            const resetZoom = () => {
                setScale(1);
                setPosition({ x: 0, y: 0 });
            };

            const handleWheel = (e) => {
                if(e.ctrlKey || scale > 1) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.2 : 0.2;
                    handleZoom(delta);
                }
            };

            // 拖曳邏輯
            const onMouseDown = (e) => {
                if (scale > 1) {
                    e.preventDefault(); 
                    setIsDragging(true);
                    dragStart.current = { x: e.clientX - position.x, y: e.clientY - position.y };
                }
            };

            const onMouseMove = (e) => {
                if (isDragging && scale > 1) {
                    e.preventDefault();
                    setPosition({
                        x: e.clientX - dragStart.current.x,
                        y: e.clientY - dragStart.current.y
                    });
                }
            };

            const onMouseUp = () => setIsDragging(false);

            return (
                <div 
                    className="w-full my-6 rounded-xl shadow-2xl border border-gray-800 bg-[#161616] relative group noselect"
                    onMouseLeave={onMouseUp}
                >
                    <div 
                        ref={containerRef}
                        className="overflow-hidden rounded-t-xl relative bg-black flex items-center justify-center min-h-[200px]"
                        onWheel={handleWheel}
                        onMouseDown={onMouseDown}
                        onMouseMove={onMouseMove}
                        onMouseUp={onMouseUp}
                        style={{ cursor: scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default' }}
                    >
                        <div 
                            style={{ 
                                transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`,
                                transition: isDragging ? 'none' : 'transform 0.2s ease-out'
                            }}
                            className="w-full h-auto origin-center"
                        >
                            {isVideo ? (
                                <video 
                                    ref={videoRef}
                                    src={src}
                                    className="w-full h-auto block pointer-events-none"
                                    autoPlay
                                    loop
                                    muted
                                    playsInline
                                    webkit-playsinline="true"
                                />
                            ) : (
                                <img 
                                    src={src}
                                    alt={hint}
                                    className="w-full h-auto block pointer-events-none"
                                />
                            )}
                        </div>

                        {scale > 1 && (
                            <div className="absolute top-3 left-3 bg-black/70 backdrop-blur text-white text-xs px-2 py-1 rounded border border-gray-700 pointer-events-none z-10">
                                {Math.round(scale * 100)}%
                            </div>
                        )}
                    </div>

                    <div className="bg-[#0f0f0f] border-t border-gray-800 px-4 py-2 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <Icon name={isVideo ? "video" : "image"} size={14} className="text-teal-500/70" />
                            <span className="text-xs text-gray-400 font-mono tracking-wide hidden sm:inline">{hint}</span>
                        </div>
                        
                        <div className="flex items-center gap-1 bg-gray-800/50 rounded-lg p-1 border border-gray-700">
                            <button 
                                onClick={() => handleZoom(-0.5)} 
                                disabled={scale <= 1}
                                className="p-1 hover:bg-gray-700 rounded text-gray-300 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                            >
                                <Icon name="minus" size={16} />
                            </button>
                            <button 
                                onClick={resetZoom}
                                className="p-1 hover:bg-gray-700 rounded text-teal-400 transition-colors"
                            >
                                <Icon name="refresh" size={14} />
                            </button>
                            <button 
                                onClick={() => handleZoom(0.5)} 
                                disabled={scale >= 5}
                                className="p-1 hover:bg-gray-700 rounded text-gray-300 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                            >
                                <Icon name="plus" size={16} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const getTopicFromHash = useCallback(() => {
                const hash = window.location.hash.replace('#', '');
                if (!hash) return tutorialData[0];
                return tutorialData.find(t => t.id === hash) || tutorialData[0];
            }, []);

            const [activeTopic, setActiveTopic] = useState(getTopicFromHash);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            useEffect(() => {
                window.location.hash = activeTopic.id;
                
                if (window.innerWidth < 768) setIsSidebarOpen(false);
                const mainContent = document.getElementById('main-content');
                if(mainContent) mainContent.scrollTop = 0;
            }, [activeTopic]);

            useEffect(() => {
                const handleHashChange = () => {
                    const newTopic = getTopicFromHash();
                    if (newTopic.id !== activeTopic.id) {
                        setActiveTopic(newTopic);
                    }
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [activeTopic, getTopicFromHash]);

            const categories = [...new Set(tutorialData.map(t => t.category))];

            return (
                <div className="flex h-screen overflow-hidden bg-[#111] text-gray-100 font-sans selection:bg-teal-500/30">
                    <div className="md:hidden fixed top-0 w-full h-16 bg-[#1a1a1a]/95 backdrop-blur border-b border-gray-800 z-50 flex items-center justify-between px-4">
                        <h1 className="text-lg font-bold text-teal-500 tracking-wide">CCFolia 教學</h1>
                        <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 text-gray-300 active:scale-95 transition-transform">
                            <Icon name="menu" />
                        </button>
                    </div>

                    <div className={`fixed inset-y-0 left-0 z-40 w-72 bg-[#161616] border-r border-gray-800 transform transition-transform duration-300 md:relative md:translate-x-0 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col shadow-2xl md:shadow-none`}>
                        <div className="p-8 border-b border-gray-800 hidden md:block">
                            <h1 className="text-2xl font-bold text-white tracking-tight">CCFolia <span className="text-teal-500">指南</span></h1>
                            <p className="text-xs text-gray-500 mt-2 font-medium tracking-wider opacity-70">TRPG 新手操作手冊</p>
                        </div>
                        
                        <nav className="flex-1 overflow-y-auto p-6 mt-16 md:mt-0 space-y-8">
                            {categories.map(cat => (
                                <div key={cat}>
                                    <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 pl-2 border-l-2 border-teal-500/30 ml-1">{cat}</h3>
                                    <div className="space-y-1">
                                        {tutorialData.filter(t => t.category === cat).map(topic => (
                                            <a
                                                key={topic.id}
                                                href={`#${topic.id}`}
                                                onClick={(e) => {
                                                    e.preventDefault(); 
                                                    setActiveTopic(topic);
                                                }}
                                                className={`w-full text-left px-4 py-3 rounded-lg transition-all text-[15px] flex items-center justify-between group cursor-pointer block ${
                                                    activeTopic.id === topic.id 
                                                    ? 'bg-teal-500/10 text-teal-400 font-medium shadow-[inset_2px_0_0_0_#14b8a6]' 
                                                    : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                                                }`}
                                            >
                                                <span>{topic.title.split('. ')[1]}</span>
                                                {activeTopic.id === topic.id && <Icon name="chevronRight" size={16} className="text-teal-500" />}
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </nav>
                    </div>

                    <main id="main-content" className="flex-1 overflow-y-auto bg-[#111] relative scroll-smooth">
                        <div className="max-w-4xl mx-auto p-5 md:p-12 pt-24 md:pt-16 pb-32">
                            <div className="mb-10 animate-fade-in">
                                <div className="inline-flex items-center px-3 py-1 rounded-full bg-gray-800/50 border border-gray-700 text-xs text-teal-400 mb-4 font-medium tracking-wide shadow-sm">
                                    {activeTopic.category}
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold text-white leading-tight">{activeTopic.title}</h2>
                                <div className="h-1 w-24 bg-gradient-to-r from-teal-600 to-teal-800 mt-6 rounded-full shadow-[0_0_15px_rgba(13,148,136,0.4)]"></div>
                            </div>

                            <div className="space-y-6">
                                {activeTopic.content.map((block, index) => {
                                    if (block.type === 'text') {
                                        return (
                                            <div key={index} className="flex items-start animate-fade-in" style={{animationDelay: `${index * 0.05}s`}}>
                                                <div className="mr-4 mt-3 w-1.5 h-1.5 rounded-full bg-teal-500 shadow-[0_0_8px_rgba(20,184,166,0.6)] flex-shrink-0"></div>
                                                <FormattedText text={block.text} />
                                            </div>
                                        );
                                    } else if (block.type === 'image') {
                                        return (
                                            <div key={index} className="animate-fade-in pl-0 md:pl-6" style={{animationDelay: `${index * 0.05}s`}}>
                                                <MediaDisplay src={block.src} hint={block.hint} />
                                            </div>
                                        );
                                    }
                                })}
                            </div>

                            <div className="mt-24 flex justify-between items-center pt-10 border-t border-gray-800/50">
                                <button 
                                    onClick={() => {
                                        const curr = tutorialData.indexOf(activeTopic);
                                        if (curr > 0) setActiveTopic(tutorialData[curr - 1]);
                                    }}
                                    disabled={tutorialData.indexOf(activeTopic) === 0}
                                    className="group flex items-center px-5 py-3 rounded-lg text-gray-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
                                >
                                    <span className="mr-2 group-hover:-translate-x-1 transition-transform">←</span> 上一章
                                </button>
                                <button 
                                    onClick={() => {
                                        const curr = tutorialData.indexOf(activeTopic);
                                        if (curr < tutorialData.length - 1) setActiveTopic(tutorialData[curr + 1]);
                                    }}
                                    disabled={tutorialData.indexOf(activeTopic) === tutorialData.length - 1}
                                    className="group flex items-center px-6 py-3 bg-teal-600 hover:bg-teal-500 text-white rounded-lg shadow-lg shadow-teal-900/20 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform hover:-translate-y-0.5"
                                >
                                    下一章 <span className="ml-2 group-hover:translate-x-1 transition-transform">→</span>
                                </button>
                            </div>
                        </div>
                    </main>
                    
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/80 z-30 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsSidebarOpen(false)}></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
